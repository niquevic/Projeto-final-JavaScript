<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="superior">
        <img class="logo" src="netflix-sem-fundo.png" alt="netflix">

        <div class="bloco-perfil">
            <div class="perfilcnjt">
                <img src="perfil-icon.png" alt="perfil">
            </div>
            <div class="texto-perfil">
                <strong>Monique</strong>
                <h6>Administrador</h6>
            </div>
        </div>
    </div>

    <div class="conteudo-principal">
        <div class="todoscards">
            
            <div class="adicionartitulo">
                <h2>Novo Título</h2>
                <img src="add-icon.png" alt="ícone" class="icone-card">
                <p>Adicione um filme/série/documentario</p>
                <button>Adicionar título</button>
            </div>

            <div class="buscartitulos">
                <h2>Buscar</h2>
                <img src="buscar-icon.png" alt="ícone" class="icone-card">
                <p>Procure um título</p>
                <button>Buscar título</button>
            </div>

            <div class="listartitulos">
                <h2>Listar todos</h2>
                <img src="listar-icon.png" alt="ícone" class="icone-card">
                <p>Listar todos os títulos cadastrados</p>
                <button>Listar títulos</button>
            </div>

            <div class="apagarid">
                <h2>Deletar por ID</h2>
                <img src="apagarid-icon.png" alt="ícone" class="icone-card">
                <p>Digite o id do título que deseja remover</p>
                <button>Apagar titulo por id</button>
            </div>

            <div class="removerultimo">
                <h2>Remover o último</h2>
                <img src="removerultimo-icon.png" alt="ícone" class="icone-card">
                <p>Remover o último título</p>
                <button>Remover o último</button>
            </div>

            <div class="limpatudo">
                <h2>Limpar</h2>
                <img src="removertudo-icon.png" alt="ícone" class="icone-card">
                <p>Apaga todos os títulos cadastrados</p>
                <button>Limpar tudo</button>
            </div>

        </div>
    </div>
</body>
</html>
